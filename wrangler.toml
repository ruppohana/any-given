name = "any-given"
main = "src/worker.ts"
compatibility_date = "2026-09-08"

# 🔴 THE CLIENT IS SERVED FROM dist/, NOT public/.
# public/ holds .ts modules that four screens import; tools/preview.mjs strips
# those types at request time and no host does. build-static.mjs emits .js beside
# every .ts and rewrites the specifiers, so dist/ is the thing that can actually
# be served. Deploying public/ would hand a browser raw TypeScript.
#   node tools/build-static.mjs   before every deploy
# 🔴 run_worker_first IS WHY THE OG TAGS WERE NEVER REWRITTEN. Cloudflare Assets
# serves a matching static file BEFORE the Worker runs — so `/` came straight off
# disk and the handler that rewrites the per-game tags never executed. The code
# was correct and unreachable, which reads exactly like code that does not work.
#
# It is a LIST rather than `true` on purpose: routing all 1,500 logo files through
# the Worker to rewrite two meta tags on one path would put a function invocation
# in front of every crest on a 131-game slate.
# /nuggets/* joins the list (2026-09-11): the day-before research now lands in KV,
# and the Worker serves KV first and the static file second at the same URL the
# client already asks for - so the screen does not change.
assets = { directory = "dist", binding = "ASSETS", run_worker_first = ["/", "/index.html", "/nuggets/*"] }

# 🔴 THE REAL DOMAIN. Bought 2026-09-08 from Cloudflare Registrar, in the same
# account this Worker deploys to — which is the whole reason .app was chosen over
# the alternatives: the registrar IS the deploy target, so there is no DNS to
# hand-configure and no third party in the path.
#
# `custom_domain = true` is not the same as a route. Cloudflare creates the DNS
# record and issues the certificate itself; a plain route would need a record
# that already existed.
#
# 🔴 AND `workers_dev = true` IS LOAD-BEARING, NOT TIDINESS. Declaring ANY route
# turns the workers.dev URL OFF by default. It happened here: the moment
# anygiven.app went live, any-given.ruppohana.workers.dev started returning
# Cloudflare error 1042 — and that was the link already sent to somebody, on the
# eve of the one night it had to work.
#
# The failure is quiet in the worst way. The deploy printed a WARNING about
# preview URLs, said "Deployed", and named the new domain; nothing in it said the
# old address had just stopped answering. A comment in this very file claimed the
# opposite and was wrong until it was tested.
#
# Both addresses answer now, and a link that is already out stays good.
workers_dev = true

# www is here because somebody will type it, and an apex-only setup answers that
# with nothing at all — not a redirect, a dead name. It costs one line.
routes = [
  { pattern = "anygiven.app", custom_domain = true },
  { pattern = "www.anygiven.app", custom_domain = true }
]

# 🔴 THE HOST POLLS, THE WORKER SERVES, AND KV IS THE JOINT.
#
# ESPN returns 403 to Cloudflare - to the datacenter, not to the header: a
# browser User-Agent was added and it changed nothing. The vault already records
# "only the host machine can reach ESPN" for the cloud container and the mount
# VM; Workers are now on that list too.
#
# So the poller runs on the machine that CAN reach the feed and pushes state up.
# The architecture is unchanged in the way that matters - ONE server polls, a
# phone holds one connection and is never given ESPN's URL - the poller just runs
# here rather than there. KV is free and holds the last state.
[[kv_namespaces]]
binding = "LIVE"
id = "2f4db44e9d21432d8ffb205f965438fa"

[vars]
SEASON = "2026"
# Sign-in codes go out from codes@anygiven.app (src/auth.ts) - anygiven.app was
# verified in Resend on 2026-09-10 at 9:50 PM, and the sandbox sender
# (onboarding@resend.dev) that stood here for the first hour is gone.
#
# 🔴 THE SWITCH. "1" = a pick, a group or a join needs a signed-in account with
# a handle; the app opens the sign-in sheet at the first pick (Jason: "first
# pick is fine"). Switched on 2026-09-10 in the same deploy that published
# /privacy.html (contact: Jason's address) - it was held at "0" only because
# collecting strangers' emails before a policy is posted is what CalOPPA forbids.
# Back to "0" is the whole rollback: device ids work again, nothing is lost.
REQUIRE_EMAIL = "1"
# 🔴 THE NUGGET DESK (src/nugget-desk.ts). "0" = the 5 AM cron does nothing; it is
# switched to "1" only after a measured test run has priced a team. The key is
# Jason's to set: `wrangler secret put ANTHROPIC_API_KEY`. The model is a var so
# it can change without a code change.
NUGGET_ENABLED = "0"
NUGGET_MODEL = "claude-sonnet-5"

# ------------------------------------------------------------------
# NOT DECLARED YET, AND ON PURPOSE
#
# Durable Objects are how MANY phones share ONE game. For one person testing
# whether the loop is fun, a Worker with a ten-second cache is enough, it runs on
# the FREE tier, and a DO would force the $5/month plan tonight for nothing. The
# binding arrives with the second viewer.
#
# D1 is the POOL's storage - pools, members, picks, scores. The live rig holds
# its state in the client and writes nothing, so an unprovisioned database would
# only be a deploy that fails for a table nobody reads. migrations/ is written
# and waiting.
#
# Both were in this file from the pool plan. Neither is deleted work - they are
# uncommented when the thing that needs them exists.
# ------------------------------------------------------------------

# 🔴 THE POOL'S STORAGE. KV holds the live game state, which is one hot document
# rewritten every few seconds and read by everybody - exactly what KV is for. A
# pool is the opposite shape: many small rows, queried by relationships (whose
# picks, in which pool, for which week) and needing them to be consistent with
# each other. That is a database, and pretending otherwise is how the board
# endpoint ended up doing a list() per poll and exhausting its daily quota.
[[d1_databases]]
binding = "DB"
database_name = "anygiven"
database_id = "6dfcb86c-03ff-48d3-bdf0-5bc7ce8a4a7d"
migrations_dir = "migrations"

# 🔴 THE LIVE POLLER, IN CLOUDFLARE RATHER THAN ON A LAPTOP. Jason, 2026-09-09:
# "Remove the puller off my machine."
#
# A Durable Object rather than a cron, and the reason is measured rather than
# stylistic: cron's floor is one minute, and tonight put the whole mechanic
# inside a 27-second window. A minute of granularity does not make the app
# slower, it removes the product. A DO alarm reschedules itself every ten
# seconds and has no lid to close.
[[durable_objects.bindings]]
name = "POLLER"
class_name = "LivePoller"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LivePoller"]

# 🔴 THE NUGGET DESK - the day-before research, off the laptop. Jason, 2026-09-11:
# "can we have this run someplace else other than my laptop in the future?" One
# DO works a queue one team per alarm against the Claude API and writes KV.
[[durable_objects.bindings]]
name = "NUGGET_DESK"
class_name = "NuggetDesk"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["NuggetDesk"]

# 🔴 THE SLATE REFRESHES ITSELF. Ten minutes: fast enough that a final score
# and a moved line are never stale for long, slow enough that ESPN never
# notices us. The LIVE feed is not here - cron's floor is one minute and the
# whole live mechanic fits in a 27-second window, which is why that half runs
# on Durable Object alarms at ten seconds instead.
[triggers]
# "0 12 * * *" is 5 AM Pacific in summer (4 AM in winter): the day-before
# nuggets seed. It only queues work when NUGGET_ENABLED = "1".
crons = ["*/10 * * * *", "0 12 * * *"]
