<!-- 🔴 OPEN GRAPH. Without these, a link shared to X, iMessage or Slack unfurls
       as a bare URL with no title, no picture and no sentence — which is exactly
       what every invite sent tonight would have looked like. X in particular
       STRIPS the URL out of the visible tweet text and shows this card instead,
       so these tags are not decoration: they ARE the post.

       og:image is an absolute URL by spec. A relative one silently yields no
       card at all, which is the failure that looks like "we have no tags". -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Any Given">
  <meta property="og:url" content="https://anygiven.app/">
  <meta property="og:title" content="Any Given Snap — call the play before it happens">
  <meta property="og:description" content="Free. No account. Nothing to install.">
  <meta property="og:image" content="https://anygiven.app/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Any Given Snap — call the play before it happens.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Any Given Snap — call the play before it happens">
  <meta name="twitter:description" content="Free. No account. Nothing to install.">
  <meta name="twitter:image" content="https://anygiven.app/og.png">
  <meta name="description" content="Call the next play before it happens. Free, no account, no install.">
  <!-- 🔴 THE BROWSER'S OWN CHROME. Jason, 2026-09-09, circling the white band
       under the nav: "Can I see thru this? The white area?"

       No - a page cannot make Safari's toolbar transparent, and nothing it can
       do will show content behind it. What it CAN do is tell the browser what
       color to paint it, which gets the thing he is actually after: one
       continuous surface to the bottom of the screen instead of the app ending
       at a white slab.

       🔴 AND THE VALUE HERE WAS #120a0e - a near-black out of the RETIRED maroon
       palette, left behind when the signature color changed. It was not doing
       any harm only because Safari was ignoring it; the moment it was honoured
       the chrome would have gone almost black under a light grey app. A stale
       color in a meta tag is invisible until it is suddenly very visible.

       Two tags, because the ground is not the same in both themes and one value
       cannot serve both. -->
  <meta name="theme-color" content="#ebebeb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">

  <!-- 🔴 ADD TO HOME SCREEN. Jason wants this on his phone for tonight's games,
       and the difference it makes is not cosmetic: a standalone launch has no
       address bar, so the floating nav stops competing with Safari's own bar
       for the same 60px at the bottom of the screen - which is the thing every
       screenshot he has sent today has shown underneath it.

       🔴 iOS IGNORES THE MANIFEST'S ICONS AND READS apple-touch-icon. Both are
       here because Android reads the manifest and iOS does not; shipping one
       is how an app ends up on a home screen as a blurry screenshot of its own
       first paint. The Apple one is also the only icon that must be opaque -
       iOS composites a transparent PNG onto black. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=stadium1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- `default` keeps the status bar readable over the light ground. `black-
       translucent` would put the clock on top of the page's own first row. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Any Given">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
  .ag-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 10px; border-bottom: 1px solid var(--line);
    background: var(--card); font-size: var(--t-micro);
  }
  .ag-bar select { font: inherit; font-size: var(--t-micro); background: var(--card);
    color: var(--fg); border: 1px solid var(--line); border-radius: var(--radius-button);
    padding: 4px 6px; max-width: 46%; }
  .ag-bar label { display: inline-flex; align-items: center; gap: 4px; color: var(--dim); }
  .ag-bar .spacer { flex: 1 1 auto; }
</style>

<body>
  <!-- The only chrome that is not the product: a screen picker, the marks switch
       and a theme override. It exists so the whole build can be walked on one
       device without a router or a server, and it is not part of any screen. -->
  <div class="ag-bar">
    <select id="picker" aria-label="Screen"></select>
    <label><input type="checkbox" id="marks"> Logos</label>
    <span class="spacer"></span>
    <select id="theme" aria-label="Theme">
      <option value="system">Auto</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>
  <style>
  /* 🔴 THE WHEEL. Jason, 2026-09-08: "We will need a wheel at the top for all the
     'stuff' like light vs dark, faq, user info, all that shit." Everything that
     is a SETTING rather than the game goes behind it — which is also what frees
     the top of the live screen, where a delay slider had been living
     permanently. It floats over the shell so it is reachable from every screen
     without any of them having to draw it. */
  /* 🔴 A REAL TOP BAR, NOT A BUTTON FLOATING OVER THE PAGE. Jason: "can I
     have a header at the top stay put with the ellipses and maybe an icon or
     text that stays put."

     The menu was `position: fixed` on its own in the corner with no bar
     behind it, which is why it kept getting lost - first over a filter chip,
     then over a card. Giving it a translucent ground made it legible and left
     it looking like a sticker. It is not a sticker; it is the app's only
     persistent control, and the thing that makes a control feel fixed rather
     than dropped on top is a surface that goes edge to edge.

     Sticky rather than fixed, and a real element in the flow, so it RESERVES
     its own height. Fixed would put every screen's first line underneath it
     and need a second number kept in sync by hand - the same class of bug as
     --nav-space at the other end of the page, which took two goes to get
     right. */
  .ag-topbar { position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; gap: 8px;
    height: 44px; padding: 0 10px 0 12px;
    background: color-mix(in srgb, var(--bg) 84%, transparent);
    -webkit-backdrop-filter: blur(12px) saturate(1.6);
    backdrop-filter: blur(12px) saturate(1.6);
    border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
  /* The stadium mark, inlined so it fills with currentColor: the header's text
     color (--fg), never the accent - the accent stays on buttons. 34px in a
     44px bar with no vertical padding, so the bar does not grow. Jason's B/W
     drawing, 2026-09-10 - decisions/the-app-icon-is-the-stadium-2026-09-10.md */
  .ag-topbar-mark { display: block; height: 34px; width: auto; aspect-ratio: 917 / 763;
    flex: 0 0 auto; color: var(--fg); }
  /* Section size (17px), up from body (13px) - Jason, 2026-09-10: "increase the
     font size for the words after the stadium". It sits beside a 34px mark. */
  .ag-topbar-t { font-size: var(--t-section); font-weight: 800; letter-spacing: -.01em;
    color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    /* Hidden while the page's own h1 is on screen - see wireTopbarTitle.
       opacity rather than display, so the mark and the menu do not jump
       sideways as it comes and goes. */
    opacity: 0; transform: translateY(2px);
    transition: opacity .16s ease, transform .16s ease; }
  .ag-topbar-t[data-show="true"] { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .ag-topbar-t { transition: none; }
  }
  .ag-topbar .spacer { flex: 1 1 auto; }
  /* WHO IS SIGNED IN, right-justified beside the menu. Jason, 2026-09-10: "on
     the header, can we add the handle they enter, right justified." Dim and
     body-size so it never competes with the screen name; it gives way first
     (ellipsis) on a narrow phone. Hidden when nobody is signed in. */
  .ag-topbar-who { flex: 0 1 auto; min-width: 0; max-width: 42%;
    font-size: var(--t-body); font-weight: 600; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* In the bar now, so it needs no ground of its own - the bar is the ground. */
  .ag-gear { flex: 0 0 auto;
    width: 40px; height: 40px; display: grid; place-items: center;
    border: 0; border-radius: var(--radius-nav, 10px);
    background: transparent; color: var(--fg); }
  .ag-gear:active { background: var(--card); }
  .ag-sheet { border: 0; padding: 0; background: transparent; color: var(--fg);
    width: min(420px, 94vw); margin: auto; }
  .ag-sheet::backdrop { background: rgba(0,0,0,.6); }
  .ag-build { font-size: 10px; color: var(--dim); letter-spacing: .04em;
    text-align: right; margin-top: -4px; }
  .ag-sheet-in { background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 16px; display: grid; gap: 14px; }
  .ag-sheet h2 { margin: 0; font-size: 17px; }
  .ag-set { display: grid; gap: 5px; }
  .ag-set-l { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--dim); }
  .ag-seg { display: grid; grid-auto-flow: column; gap: 6px; }
  .ag-seg button { font: inherit; font-size: 13px; min-height: 38px; border: 1px solid var(--line);
    border-radius: 9px; background: transparent; color: var(--fg); }
  .ag-seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); font-weight: 800; border-color: var(--accent); }
  .ag-row { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    font-size: 13px; color: var(--dim); }
  .ag-sheet input[type=range] { width: 100%; }
  .ag-sheet input[type=text] { font: inherit; width: 100%; padding: 9px; border: 1px solid var(--line);
    border-radius: 9px; background: var(--bg); color: var(--fg); }
  .ag-close { font: inherit; font-weight: 800; min-height: 44px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--bg); }
  .ag-faq { font-size: 12px; color: var(--dim); line-height: 1.5; margin: 0; }
  /* The sample-data banner. Loud enough to be believed, quiet enough to live
     above every pool screen without becoming the design. */
  .ag-sample { margin: 0 0 10px; padding: 8px 10px; font-size: 12px; line-height: 1.4;
    color: var(--dim); border: 1px dashed var(--line); border-radius: 10px; }
  /* The rotating completion of "Any Given…" in the bar on the front door. */
  .ag-given { display: inline-block; color: var(--accent);
    transition: opacity .25s ease, transform .25s ease; }
  .ag-given.is-out { opacity: 0; transform: translateY(-4px); }
  @media (prefers-reduced-motion: reduce) { .ag-given { transition: none; } }
  </style>

         and it was not a drawing problem: a 24-viewBox cog rendered at 20px is a
         circle with a bumpy edge, because the teeth are sub-pixel. It reads as a
         smudge on a phone, which is exactly what he saw.
         An overflow menu is three dots at any size, it is what a phone user
         already reaches for, and it does not pretend the sheet behind it is
         "system settings" — it is a menu. -->
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <circle cx="12" cy="5" r="2" fill="currentColor"/>
      <circle cx="12" cy="12" r="2" fill="currentColor"/>
      <circle cx="12" cy="19" r="2" fill="currentColor"/>
    </svg>
  </button>
    </header>
    <main class="ag-main" id="root"></main>
  </div>
  <script type="module" src="/app.js"></script>
  <!-- 🔴 THE SMOKE HOOK. tools/smoke.mjs drives every route in headless
       Chrome after a deploy, because the 678 unit tests cannot see a blank
       screen - three separate times today a screen died at RENDER with every
       file returning 200 and every test green, and each one was found by
       Jason looking at his phone.

       It lives in the page rather than in the tool because Chrome's
       --dump-dom cannot inject a script: the page walks its own routes and
       leaves the verdict in #smoke-result for the tool to read. It costs
       nothing when the flag is absent, and the flag is the only thing that
       makes any of it run. -->
  <script type="module">
  if (new URLSearchParams(location.search).has('smoke')) {
    const ROUTES = ['home','live','allgames','buildparlay','slate','slate131',
      'picks','parlay','standings','create','invite','rules','now','landed',
      'missed','game','board','delay','cold','alerts','share','settings','offline'];
    const errs = [];
    addEventListener('error', (e) => errs.push(String(e.message || e)));
    addEventListener('unhandledrejection', (e) => errs.push(String(e.reason)));
    (async () => {
      const out = [];
      for (const r of ROUTES) {
        location.hash = '#/' + r;
        await new Promise((z) => setTimeout(z, 1200));
        const main = document.querySelector('.ag-main');
        const text = ((main && main.innerText) || '').trim();
        const boundary = [...document.querySelectorAll('.state-title')]
          .map((x) => x.textContent)
          .filter((t) => /did not load|went wrong/i.test(t));
        out.push({ route: r, chars: text.length, boundary: boundary[0] || null,
          thin: text.length < 40, detail: boundary[0] ? text.slice(0, 200) : null });
      }
      const pre = document.createElement('pre');
      pre.id = 'smoke-result';
      pre.textContent = JSON.stringify({ out, errs });
      document.body.appendChild(pre);
    })();
  }
  </script>
</body>
</html>
